name: Bootstrap checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
      ADMIN_DATABASE_URL: postgresql://local_admin:synthetic-ci-admin@127.0.0.1:5432/postgres
      NOOLA_MIGRATION_PASSWORD: synthetic-ci-owner
      NOOLA_APP_PASSWORD: synthetic-ci-app
      DATABASE_URL: postgresql://noola_app:synthetic-ci-app@127.0.0.1:5432/noola
      MIGRATION_DATABASE_URL: postgresql://noola_owner:synthetic-ci-owner@127.0.0.1:5432/noola
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_USER: local_admin
          POSTGRES_PASSWORD: synthetic-ci-admin
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U local_admin -d postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @noola/api db:provision
      - run: pnpm --filter @noola/api db:migrate
      - run: pnpm --filter @noola/api test:integration
      - run: pnpm --filter @noola/api phase0:runtime
      - name: Upstream declaration diagnostic (approved backend exception)
        id: phase0-declarations
        continue-on-error: true
        run: pnpm phase0:declarations
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
