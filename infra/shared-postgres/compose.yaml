name: local-infra
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    restart: unless-stopped
    environment:
      POSTGRES_USER: local_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run pnpm env:init}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      shared:
        aliases: [local-postgres]
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U local_admin -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  postgres-data:
    external: true
    name: local-postgres-data
networks:
  shared:
    external: true
    name: local-databases
